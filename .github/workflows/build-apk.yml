name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manually triggering the build from the GitHub actions tab

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configure Maven Central Mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/maven-mirror.gradle
          allprojects {
              buildscript {
                  repositories {
                      all { repo ->
                          if (repo instanceof MavenArtifactRepository) {
                              def url = repo.url.toString()
                              if (url.contains("repo1.maven.org/maven2") || url.contains("repo.maven.apache.org/maven2")) {
                                  repo.url = 'https://maven-central.storage-download.googleapis.com/maven2/'
                              }
                          }
                      }
                      maven {
                          name = 'mavenCentralFallback'
                          url = 'https://repo.maven.apache.org/maven2/'
                      }
                  }
              }
              repositories {
                  all { repo ->
                      if (repo instanceof MavenArtifactRepository) {
                          def url = repo.url.toString()
                          if (url.contains("repo1.maven.org/maven2") || url.contains("repo.maven.apache.org/maven2")) {
                              repo.url = 'https://maven-central.storage-download.googleapis.com/maven2/'
                          }
                      }
                  }
                  maven {
                      name = 'mavenCentralFallback'
                      url = 'https://repo.maven.apache.org/maven2/'
                  }
              }
          }
          EOF

      - name: Build Android App (APK)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: undiruv-bank-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
